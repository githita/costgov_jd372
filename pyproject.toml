[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "githita-costgov_jd372"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "githita" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://githita.github.io"
Repository = "https://github.com/githita/costgov_jd372"
Issues = "https://github.com/githita/costgov_jd372/issues"

[project.scripts]
costgov_jd372 = "costgov_jd372:main"

[tool.setuptools]
py-modules = ["costgov_jd372"]
